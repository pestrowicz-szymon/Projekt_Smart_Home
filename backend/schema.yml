openapi: 3.0.3
info:
  title: Smart Home API
  version: 1.0.0
  description: JWT-protected REST API for smart home homes, devices, readings, and
    commands.
paths:
  /api/devices/actions/:
    get:
      operationId: devices_actions_list
      summary: List device actions
      tags:
      - device-actions
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceAction'
          description: ''
  /api/devices/actions/{id}/:
    get:
      operationId: devices_actions_retrieve
      summary: Get device action
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device action.
        required: true
      tags:
      - device-actions
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAction'
          description: ''
  /api/devices/devices/:
    get:
      operationId: devices_devices_list
      summary: List devices
      parameters:
      - in: query
        name: room_id
        schema:
          type: integer
        description: Filter devices by room id.
      tags:
      - devices
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
              examples:
                FilterByRoom:
                  value:
                  - 7
                  summary: Filter by room
          description: ''
    post:
      operationId: devices_devices_create
      summary: Create device
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
            examples:
              CreateDevice:
                value:
                  home_id: 1
                  room_id: 7
                  name: Thermometer Kitchen
                  device_type: thermometer
                  hardware_id: hw-thermo-001
                  is_active: true
                  current_state: 21.5
                  state_payload:
                    battery: 95
                summary: Create device
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                DeviceResponse:
                  value:
                    id: 31
                    home_id: 1
                    room:
                      id: 7
                      name: Living Room
                      description: Main living area
                    room_id: 7
                    name: Thermometer Kitchen
                    device_type: thermometer
                    hardware_id: hw-thermo-001
                    status: unknown
                    is_active: true
                    current_state: 21.5
                    state_payload:
                      battery: 95
                    certificate_fingerprint: null
                    last_seen_at: null
                    created_at: '2026-05-24T10:00:00Z'
                    updated_at: '2026-05-24T10:00:00Z'
                  summary: Device response
          description: ''
  /api/devices/devices/{id}/:
    get:
      operationId: devices_devices_retrieve
      summary: Get device details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                DeviceResponse:
                  value:
                    id: 31
                    home_id: 1
                    room:
                      id: 7
                      name: Living Room
                      description: Main living area
                    room_id: 7
                    name: Thermometer Kitchen
                    device_type: thermometer
                    hardware_id: hw-thermo-001
                    status: unknown
                    is_active: true
                    current_state: 21.5
                    state_payload:
                      battery: 95
                    certificate_fingerprint: null
                    last_seen_at: null
                    created_at: '2026-05-24T10:00:00Z'
                    updated_at: '2026-05-24T10:00:00Z'
                  summary: Device response
          description: ''
    put:
      operationId: devices_devices_update
      summary: Update device
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
            examples:
              CreateDevice:
                value:
                  home_id: 1
                  room_id: 7
                  name: Thermometer Kitchen
                  device_type: thermometer
                  hardware_id: hw-thermo-001
                  is_active: true
                  current_state: 21.5
                  state_payload:
                    battery: 95
                summary: Create device
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                DeviceResponse:
                  value:
                    id: 31
                    home_id: 1
                    room:
                      id: 7
                      name: Living Room
                      description: Main living area
                    room_id: 7
                    name: Thermometer Kitchen
                    device_type: thermometer
                    hardware_id: hw-thermo-001
                    status: unknown
                    is_active: true
                    current_state: 21.5
                    state_payload:
                      battery: 95
                    certificate_fingerprint: null
                    last_seen_at: null
                    created_at: '2026-05-24T10:00:00Z'
                    updated_at: '2026-05-24T10:00:00Z'
                  summary: Device response
          description: ''
    patch:
      operationId: devices_devices_partial_update
      summary: Patch device
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeviceRequest'
            examples:
              CreateDevice:
                value:
                  home_id: 1
                  room_id: 7
                  name: Thermometer Kitchen
                  device_type: thermometer
                  hardware_id: hw-thermo-001
                  is_active: true
                  current_state: 21.5
                  state_payload:
                    battery: 95
                summary: Create device
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeviceRequest'
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                DeviceResponse:
                  value:
                    id: 31
                    home_id: 1
                    room:
                      id: 7
                      name: Living Room
                      description: Main living area
                    room_id: 7
                    name: Thermometer Kitchen
                    device_type: thermometer
                    hardware_id: hw-thermo-001
                    status: unknown
                    is_active: true
                    current_state: 21.5
                    state_payload:
                      battery: 95
                    certificate_fingerprint: null
                    last_seen_at: null
                    created_at: '2026-05-24T10:00:00Z'
                    updated_at: '2026-05-24T10:00:00Z'
                  summary: Device response
          description: ''
    delete:
      operationId: devices_devices_destroy
      summary: Delete device
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/devices/devices/{id}/actions/:
