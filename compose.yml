services:
    db:
        image: postgres:18.0
        environment:
            - POSTGRES_DB=smarthome_db
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=admin
            - POSTGRES_HOST=localhost
            - POSTGRES_PORT=5432

        ports:
            - "5432:5432"
        volumes:
            - smart_home_postgres_volume:/var/lib/postgresql

    mosquitto:
        image: eclipse-mosquitto:2
        ports:
            - "8883:8883"
        volumes:
            - ./mosquitto/config:/mosquitto/config
            - ./mosquitto/data:/mosquitto/data
            - ./mosquitto/log:/mosquitto/log

    # frontend:
    #   build:
    #     context: ./frontend
    #     dockerfile: ./frontend/Containerfile
    #   ports:
    #     - "5173:5173"

volumes:
    smart_home_postgres_volume:
